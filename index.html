<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Sign Up Form</title>
</head>
<body>  
    <div class="main">
        <div class="logo-section">
                <img src="./images/halie-west-25xggax4bSA-unsplash.jpg" alt="Background image">
            <div class="logo-container">
                <img class="logo" src="./images/odin-lined.png" alt="Logo">
                <span>Odin</span>
            </div>
            <span class="logo-section-footer">Photo by <span class="underline">Halie West</span> on <span class="underline">Unsplash</span></span>
        </div>
        <div class="form-section">
            <div>
                <p>This is not real online service! You know you need something like this is in your
                    life to help you realize your deepest dreams. <br> Sign up now to get started.
                </p>
                <p>You know you want to.</p>
            </div>
            <form action="#">
                <div class="floating">
                    <span class="form-title">Let's do this!</span>
                    
                    <div class="inputs-container">
                        <span>
                            <label for="first_name">First name</label>
                            <input type="text" name="first_name" id="first_name">
                        </span>

                        <span>
                            <label for="last_name">Last name</label>
                            <input type="text" name="last_name" id="last_name">
                        </span>
    
                        <span>
                            <label for="email">Email</label>
                            <input type="email" name="email" id="email">
        
                        </span>
                        <span>
                            <label for="phone_number">Phone number</label>
                            <input type="number" name="phone_number" id="phone_number">
        
                        </span>
                        <span>
                            <label for="password">Password</label>
                            <input type="password" name="password" id="password">
        
                        </span>
                        <span>
                            <label for="confirm_password">Confirm password</label>
                            <input type="password" name="confirm_password" id="confirm_password">
                        </div>
                        </span>
                </div>
                <button type="submit">Create Account</button>
            </form>
            <span>Already have an account? <a href="#">Log in</a></span>
        </div>
    </div>
</body>
</html>
