<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Sign Up Form</title>
</head>
<body>  
    <div class="main">
        <div class="logo-section">
            <img src="./images/halie-west-25xggax4bSA-unsplash.jpg" alt="Background image">
            <div class="logo-container">
                <img src="./images/odin-lined.png" alt="Logo">
                <span>Odin</span>
            </div>
            <span>Photo by <span class="underline">Halie West</span> on <span class="underline">Unsplash</span></span>
        </div>
        <div class="form-section">
            <p>This is not real online service! You know you need something like this int your
                life to help you realize your deepest dreams. <br> Sign up now to get started.
            </p>
            <form action="#">
                <div class="floating">
                    <span>Let's do this!</span>
                    
                    <label for="first_name">First name</label>
                    <input type="text" name="first_name" id="first_name">

                    <label for="last_name">Last name</label>
                    <input type="text" name="last_name" id="last_name">

                    <label for="email">Email</label>
                    <input type="email" name="email" id="email">

                    <label for="phone_number">Phone number</label>
                    <input type="number" name="phone_number" id="phone_number">

                    <label for="password">Password</label>
                    <input type="password" name="password" id="password">

                    <label for="confirm_password">Confirm password</label>
                    <input type="password" name="confirm_password" id="confirm_password">
                </div>
                <button type="submit">Create Account</button>
            </form>
            <span>Already have an account? <a href="#">Log in</a></span>
        </div>
    </div>
</body>
</html>
